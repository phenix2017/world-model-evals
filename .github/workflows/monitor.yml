name: Monitor benchmarks

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/benchmarks.csv"
      - "scripts/update.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh metrics and regenerate docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data README.md docs/positioning.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh benchmark metrics"
            git push
          fi
